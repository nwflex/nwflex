# Compound sweep — all 9 motif-length pairs × N-pair × bridge length.
#
# Writes one tidy-frame CSV shard per (motif-pair, N-pair, bridge) task
# to supplement/data/compound/.  Small motif-length strata saturate
# (1×1 at 12 unique pairs; 1×2 and 2×1 at 48), so the actual total is
# ~10,620 tasks rather than the nominal 9 × 100 × 3 × 5 = 13,500.
# Local steady-state ~1.3 task/s on 56 workers → ~2 h wall.
#
# Usage:
#   python scripts/run_batch_sweep.py --config scripts/configs/compound.yaml --workers 56

seed: 20260512

panel: data/hg38_motif_sample_K100.tsv

single_repeat:
  motif_lengths: []           # empty -> single-repeat section produces 0 tasks
  loci_per_length: 0
  N_values: []
  delta_range: [-5, 5]
  snv_positions: [null]
  read_len: 150
  k_min_flank: 1

compound:
  motif_length_pairs:
    - [1, 1]
    - [1, 2]
    - [1, 3]
    - [2, 1]
    - [2, 2]
    - [2, 3]
    - [3, 1]
    - [3, 2]
    - [3, 3]
  pairs_per_length_pair: 100  # caps each stratum; 1×1 saturates at 12
                              # unique pairs, 1×2 and 2×1 at 48, the rest at 100
  N_pairs:
    - [10, 10]
    - [5, 15]
    - [15, 5]
  bridge_lengths: [1, 2, 3, 4, 5]
  delta1_range: [-5, 5]
  delta2_range: [-5, 5]
  read_len: 150
  k_min_flank: 1

output:
  data_dir: supplement/data
  figures_dir: supplement/figures
  tables_dir: supplement/tables

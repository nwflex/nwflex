# Full compound sweep, writing to a separate output tree so it does
# not overwrite or commingle with the slim compound shards already in
# supplement/data/compound/.  Identical sweep parameters to large.yaml;
# only output.data_dir differs.
#
# Total: 460 motif pairs * 3 N-pairs * 5 bridges = 6900 tasks.
# Local steady-state ~1.29 task/s on 56 workers → ~90 min wall.
#
# Usage:
#   python scripts/run_batch_sweep.py --config scripts/configs/large_full.yaml --workers 56

seed: 20260512

panel: data/hg38_motif_sample_K100.tsv

single_repeat:
  motif_lengths: []
  loci_per_length: 0
  N_values: []
  delta_range: [-5, 5]
  snv_positions: [null]
  read_len: 150
  k_min_flank: 1

compound:
  motif_length_pairs:
    - [1, 1]
    - [1, 2]
    - [1, 3]
    - [2, 2]
    - [2, 3]
    - [3, 3]
  pairs_per_length_pair: 100
  N_pairs:
    - [10, 10]
    - [5, 15]
    - [15, 5]
  bridge_lengths: [1, 2, 3, 4, 5]
  delta1_range: [-5, 5]
  delta2_range: [-5, 5]
  read_len: 150
  k_min_flank: 1

output:
  data_dir: supplement/data_full
  figures_dir: supplement/figures_full
  tables_dir: supplement/tables_full

# Slim compound sweep (~10-15 minutes local on a 64-thread box).
#
# Cuts large.yaml down to what the manuscript figures actually need:
# motif-length pair × motif-similarity × bridge-length × N-pair
# asymmetry. The (Δ1, Δ2) sweep inside each task is exhaustive, so
# every kept task still produces a full per-arm heatmap.
#
# Dropped vs large.yaml:
#   - pairs_per_length_pair: 100 -> 20 (small strata saturate at 12, 48)
#   - bridge_lengths: [1,2,3,4,5] -> [1,3,5]  (keeps the trend ends + middle)
# Kept:
#   - 6 motif-length pairs
#   - N_pairs: [10,10] and [5,15]  (count asymmetry effect)
#
# Total: 140 motif pairs * 2 N-pairs * 3 bridges = 840 tasks.
#
# Usage:
#   python scripts/run_batch_sweep.py --config scripts/configs/slim.yaml --workers 56

seed: 20260513

panel: data/hg38_motif_sample_K100.tsv

single_repeat:
  motif_lengths: []
  loci_per_length: 0
  N_values: []
  delta_range: [-5, 5]
  snv_positions: [null]
  read_len: 150
  k_min_flank: 1

compound:
  motif_length_pairs:
    - [1, 1]
    - [1, 2]
    - [1, 3]
    - [2, 2]
    - [2, 3]
    - [3, 3]
  pairs_per_length_pair: 20
  N_pairs:
    - [10, 10]
    - [5, 15]
  bridge_lengths: [1, 3, 5]
  delta1_range: [-5, 5]
  delta2_range: [-5, 5]
  read_len: 150
  k_min_flank: 1

output:
  data_dir: supplement/data
  figures_dir: supplement/figures
  tables_dir: supplement/tables

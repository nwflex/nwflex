# Full compound sweep — transposed motif-length pairs.
#
# Companion to large_full.yaml.  Fills in the strict-lower-triangle
# motif-length pairs {(2,1),(3,1),(3,2)} so the (motif1_len × motif2_len)
# grid in Fig 4 (and the merged Fig 3) is complete at full sweep size,
# matching large_full's per-stratum count of 100 motif pairs.
#
# Writes to supplement/data_full/compound/ alongside large_full's
# shards.  Task IDs include pind1_pind2 so there are no collisions
# between this run and large_full.
#
# Total: 3 length pairs × ~ {48, 100, 100} = ~248 motif pairs
#        × 3 N-pairs × 5 bridges = ~3,720 tasks
# Expected wall ~30-40 min on 56 workers.

seed: 20260512

panel: data/hg38_motif_sample_K100.tsv

single_repeat:
  motif_lengths: []
  loci_per_length: 0
  N_values: []
  delta_range: [-5, 5]
  snv_positions: [null]
  read_len: 150
  k_min_flank: 1

compound:
  motif_length_pairs:
    - [2, 1]
    - [3, 1]
    - [3, 2]
  pairs_per_length_pair: 100
  N_pairs:
    - [10, 10]
    - [5, 15]
    - [15, 5]
  bridge_lengths: [1, 2, 3, 4, 5]
  delta1_range: [-5, 5]
  delta2_range: [-5, 5]
  read_len: 150
  k_min_flank: 1

output:
  data_dir: supplement/data_full
  figures_dir: supplement/figures_full
  tables_dir: supplement/tables_full

# Large batch (a few hours): compound sweep only.
#
# Runs the compound half of the comprehensive sweep — sampled motif
# pairs × {N-pair, bridge length, (Δ1, Δ2)} — writing one CSV shard per
# (motif-pair, N-pair, bridge) task to supplement/data/compound/. The
# single-repeat block is vacated so this config does no single-repeat
# work; pair it with small.yaml for the full (single + compound)
# supplement build.
#
# Usage:
#   python scripts/run_batch_sweep.py --config scripts/configs/large.yaml

seed: 20260512

panel: data/hg38_motif_sample_K100.tsv

single_repeat:
  motif_lengths: []           # empty -> single-repeat section produces 0 tasks
  loci_per_length: 0
  N_values: []
  delta_range: [-5, 5]
  snv_positions: [null]
  read_len: 150
  k_min_flank: 1

compound:
  motif_length_pairs:
    - [1, 1]
    - [1, 2]
    - [1, 3]
    - [2, 2]
    - [2, 3]
    - [3, 3]
  pairs_per_length_pair: 100   # caps each stratum; 1x1 saturates at 12
                               # unique pairs, 1x2 at 48, the rest at 100
  N_pairs:
    - [10, 10]
    - [5, 15]
    - [15, 5]
  bridge_lengths: [1, 2, 3, 4, 5]
  delta1_range: [-5, 5]
  delta2_range: [-5, 5]
  read_len: 150
  k_min_flank: 1

output:
  data_dir: supplement/data
  figures_dir: supplement/figures
  tables_dir: supplement/tables
